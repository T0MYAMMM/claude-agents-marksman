[project]
name = "agent-orchestrator-backend"
version = "0.1.0"
description = "Backend API for the AI Agent Orchestration and Artifact Management System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "aiosqlite>=0.20",        # async SQLite for dev/tests
    "asyncpg>=0.29",          # async Postgres for prod
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",   # installed-app OAuth flow for user credentials
    "tenacity>=8.4",          # exponential backoff / retry
    "anthropic>=0.40",        # Claude SDK for the Markdown-editing chat assistant
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
# B008: calling Depends()/Header() in argument defaults is the standard FastAPI idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
